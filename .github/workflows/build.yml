name: Build

on:
  push:
    branches: [main, feature/pulse-doma-skeleton]
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend from lockfile
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check and build frontend
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm test
          pnpm build
      - name: Build all modules
        run: mvn -B clean verify -Dwebhook.redis.port=6379
