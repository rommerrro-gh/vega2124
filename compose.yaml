services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SQLITE_URL: jdbc:sqlite:/app/data/pulse-doma.db
      REDIS_HOST: redis
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-local-dev-secret}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CONTRACT_ADAPTER_URL: http://contract-adapter:8081
    volumes:
      - sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      contract-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
  contract-adapter:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/contract-adapter/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sqlite-data:
  redis-data:
  minio-data:
