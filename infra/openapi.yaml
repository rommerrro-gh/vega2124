        houseId: {type: [string, 'null']}
        houseAddress: {type: [string, 'null']}
        status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}
        userId: {type: [string, 'null']}
        displayName: {type: [string, 'null']}
    AccessInvitation:
      type: object
      properties:
        id: {type: string}
        role: {type: string, enum: [UK_ADMIN, DISPATCHER, HOUSE_ADMIN, RESIDENT]}
        organizationId: {type: [string, 'null']}
        organizationName: {type: [string, 'null']}
        houses: {type: array, items: {$ref: '#/components/schemas/AccessHouse'}}
        inviter: {type: string}
        expiresAt: {type: string, format: date-time}
        activationLimit: {type: integer}
        activationCount: {type: integer}
        revokedAt: {type: [string, 'null'], format: date-time}
        acceptedByMe: {type: boolean}
    CreateAccessInvitation:
      type: object
      required: [role, houseIds, days, activationLimit]
      properties:
        role: {type: string, enum: [UK_ADMIN, DISPATCHER, HOUSE_ADMIN, RESIDENT]}
        organizationId: {type: [string, 'null']}
        houseIds: {type: array, minItems: 1, items: {type: string}}
        days: {type: integer, minimum: 1, maximum: 30}
        activationLimit: {type: integer, minimum: 1, maximum: 100}
    RevokeAccessRequest:
      type: object
      required: [role, userId]
      properties:
        role: {type: string, enum: [UK_ADMIN, DISPATCHER, HOUSE_ADMIN, RESIDENT]}
        userId: {type: string}
        organizationId: {type: [string, 'null']}
        houseId: {type: [string, 'null']}
    HouseView:
      type: object
      required: [id, address, memberships]
      properties:
        id: {type: string}
        address: {type: string}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/HouseMembershipAccess'}
    HouseMembershipAccess:
      type: object
      required: [role, verificationStatus]
      properties:
        role: {type: string, enum: [RESIDENT, HOUSE_ADMIN, DISPATCHER]}
        verificationStatus: {type: string, enum: [INVITED, PENDING, VERIFIED, REJECTED]}
    HousePassport:
      type: object
      required: [id, address, fields, contacts]
      properties:
        id: {type: string}
        address: {type: string}
        fields:
          type: array
          items: {$ref: '#/components/schemas/HousePassportField'}
        contacts:
          type: array
          items: {$ref: '#/components/schemas/HouseContact'}
    HousePoll:
      type: object
      description: Preliminary poll; never an official owners' meeting or binding vote
      required: [id, houseId, question, official, closesAt, createdAt, closed, resultsVisible, options]
      properties:
        id: {type: string}
        houseId: {type: string}
        question: {type: string}
        official: {type: boolean, const: false}
        closesAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        closed: {type: boolean}
        resultsVisible: {type: boolean}
        myOptionId: {type: [string, 'null']}
        options:
          type: array
          items: {$ref: '#/components/schemas/HousePollOption'}
    HousePollOption:
      type: object
      required: [id, label, votes]
      properties:
        id: {type: string}
        label: {type: string}
        votes: {type: integer, minimum: 0, description: Zero while resultsVisible is false}
    HousePollVoteRequest:
      type: object
      required: [optionId]
      properties:
        optionId: {type: string, minLength: 1}
    HouseContact:
      type: object
      required: [id, type, title, phone, updatedAt]
      properties:
        id: {type: string}
        type: {type: string, enum: [EMERGENCY, LOCAL]}
        title: {type: string}
        phone: {type: string}
        details: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    HouseContactRequest:
      type: object
      required: [type, title, phone]
      properties:
        type: {type: string, enum: [EMERGENCY, LOCAL]}
        title: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, pattern: '^[+0-9() .-]{2,40}$'}
        details: {type: [string, 'null'], maxLength: 500}
    HouseInvitation:
      type: object
      required: [id, expiresAt, activationLimit, activationCount, createdAt]
      properties:
        id: {type: string}
        expiresAt: {type: string, format: date-time}
        activationLimit: {type: integer}
        activationCount: {type: integer}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    CreateHouseInvitationRequest:
      type: object
      required: [days, activationLimit]
      properties:
        days: {type: integer, minimum: 1, maximum: 30}
        activationLimit: {type: integer, minimum: 1, maximum: 100}
    CreatedHouseInvitation:
      type: object
      required: [token, invitation]
      properties:
        token: {type: string}
        invitation: {$ref: '#/components/schemas/HouseInvitation'}
    HousePassportField:
      type: object
      required: [key, value, source, fetchedAt]
      properties:
        key: {type: string}
        value: {}
        source: {type: string}
        sourceUrl: {type: [string, 'null'], format: uri}
        fetchedAt: {type: string, format: date-time}
        validAt: {type: [string, 'null'], format: date-time}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
    IssueView:
      type: object
      required: [id, houseId, address, status, description, participants, attachments, reports, plannedDateHistory, mergedForMe]
      properties:
        id: {type: string}
        houseId: {type: string}
        address: {type: string}
        category: {type: string, nullable: true}
        status: {type: string}
        description: {type: string}
        location: {type: string, nullable: true}
        occurredAt: {type: string, format: date-time, nullable: true}
        verificationDueAt: {type: string, format: date-time, nullable: true}
        plannedDate: {type: [string, 'null'], format: date, description: Completion target in Europe/Moscow calendar dates}
        dispatcherComment:
          type: object
          nullable: true
          description: Latest nonempty dispatcher comment on a status change
          properties:
            text: {type: string}
            status: {type: string}
            changedAt: {type: string, format: date-time}
        plannedDateHistory:
          type: array
          items: {$ref: '#/components/schemas/PlannedDateChange'}
        participants: {type: integer}
        mergedForMe: {type: boolean, description: The current resident has an active report moved here by a dispatcher merge}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/AttachmentView'}
        reports:
          type: array
          description: Active reports visible to the current user; residents see only their own, dispatchers see all
          items: {$ref: '#/components/schemas/LinkedReportView'}
    LinkedReportView:
      type: object
      required: [id, description, author, createdAt]
      properties:
        id: {type: string}
        description: {type: string}
        author: {type: string}
        createdAt: {type: string}
    PlannedDateChange:
      type: object
      required: [newDate, previousDateMissed, changedAt]
      properties:
        previousDate: {type: [string, 'null'], format: date}
        newDate: {type: string, format: date}
        previousDateMissed: {type: boolean}
        reason: {type: [string, 'null']}
        changedAt: {type: string, format: date-time}
    AttachmentView:
      type: object
      required: [id, mime]
      properties:
        id: {type: string}
        mime: {type: string}
    ErrorResponse:
      type: object
      required: [code, message, details, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object}
        correlationId: {type: string}
    MaxUpdate:
      type: object
      required: [update_type]
      properties:
        update_type: {type: string, minLength: 1}
      additionalProperties: true
    SetActiveHouseRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}
    CreateReportRequest:
      type: object
      required: [houseId, text, category]
      anyOf:
        - required: [locationFeatures]
        - required: [location]
      properties:
        houseId: {type: string, minLength: 1}
        text: {type: string, minLength: 1, maxLength: 4000}
        category: {type: string, enum: [LIGHTING, WATER, HEATING, ELEVATOR, ENTRANCE_CLEANING, YARD_CLEANING, WASTE_REMOVAL, PLAYGROUND, OTHER]}
        location: {type: string, minLength: 1, maxLength: 160, description: Legacy free text place}
        locationFeatures: {$ref: '#/components/schemas/LocationFeatures'}
        occurredAt: {type: string, format: date-time, description: Optional occurrence time; defaults to server receipt time}
    LocationFeatures:
      type: object
      required: [area]
      description: Category-specific place. Entrance/floor required for local indoor problems; liftType required for elevators; coverage required for entrance cleaning. Apartment numbers are not collected.
      properties:
        area: {type: string, enum: [ENTRANCE, APARTMENT, BASEMENT, YARD, WHOLE_HOUSE, OTHER]}
        entrance: {type: [integer, 'null'], minimum: 1, maximum: 100}
        floor: {type: [integer, 'null'], minimum: 1, maximum: 200}
        liftType: {type: [string, 'null'], enum: [PASSENGER, CARGO, UNKNOWN, null]}
        liftNumber: {type: [integer, 'null'], minimum: 1, maximum: 100}
        coverage: {type: [string, 'null'], enum: [LOCAL, ENTIRE, null]}
        object: {type: [string, 'null'], enum: [SWING, SLIDE, SANDBOX, OTHER, WHOLE_PLAYGROUND, null]}
        site: {type: [integer, 'null'], minimum: 1, maximum: 100}
        details: {type: [string, 'null'], maxLength: 160}
    CreateReportResponse:
      type: object
      required: [reportId, correlationId, candidates]
      properties:
        reportId: {type: string, format: uuid}
        correlationId: {type: string, format: uuid}
        candidates:
          type: array
          items:
            type: object
            required: [issueId, score, reasons]
            properties:
              issue:
                type: object
                description: Preview for a verified resident of the same house, without attachments or author data
                properties:
                  id: {type: string}
                  houseId: {type: string}
                  address: {type: string}
                  category: {type: string}
                  description: {type: string}
                  location: {type: string}
                  participants: {type: integer}
              issueId: {type: string}
              score: {type: number, format: double}
              reasons:
                type: array
                items: {type: string}
    WithdrawReportRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CreateIssueRequest:
      type: object
      required: [reportId]
      properties:
        reportId: {type: string, minLength: 1}
    JoinIssueRequest:
      type: object
      required: [reportId]
      properties:
        reportId: {type: string, minLength: 1}
    MergeIssueRequest:
      type: object
      required: [targetIssueId]
      properties:
        targetIssueId: {type: string, minLength: 1}
    SplitIssueRequest:
      type: object
      required: [reportId, reason]
      properties:
        reportId: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
    ChangeStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [DRAFT, OPEN, ASSIGNED, IN_PROGRESS, RESOLVED, VERIFICATION_72H, CLOSED_CONFIRMED, CLOSED_UNCONFIRMED, REVIEW_REQUIRED, REOPENED, WITHDRAWN, REJECTED]
        reason: {type: string, minLength: 1}
    SetPlannedDateRequest:
      type: object
      required: [date]
      properties:
        date: {type: string, format: date}
        reason: {type: string, maxLength: 1000, description: Required when changing an existing date}
    VerifyIssueRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
        comment: {type: string, maxLength: 2000}
    AddCommentRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    CreateIncidentRequest:
      type: object
      required: [houseId, type, description]
      properties:
        houseId: {type: string, minLength: 1}
        type: {type: string, minLength: 1}
        description: {type: string, minLength: 1, maxLength: 4000}
    CreatePollRequest:
      type: object
      required: [question, options, closesAt]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 200}
        closesAt: {type: string, format: date-time}
        resultsHiddenUntilClose: {type: boolean, default: false}
    SyncRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}

    CreateResidentCase:
      type: object
      required: [houseId, description, clientRequestId]
      properties:
        houseId: {type: string, minLength: 1}
        kind: {type: string, enum: [GENERAL, PROBLEM, PAYMENT], default: GENERAL}
        description: {type: string, minLength: 1, maxLength: 4000}
        location: {type: [string, 'null'], maxLength: 160}
        clientRequestId: {type: string, minLength: 1, maxLength: 80}
    UpdateResidentCase:
      type: object
      required: [kind, status, nextStep, revision]
      properties:
        kind: {type: string, enum: [GENERAL, PROBLEM, PAYMENT, WARRANTY]}
        status: {type: string, enum: [IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED]}
        nextStep: {type: string, minLength: 1, maxLength: 600}
        reason: {type: string, maxLength: 1000, description: Обязательна при переносе известного срока или смене назначенного ответственного}
        dueAt: {type: [string, 'null'], format: date-time}
        responsibleUserId: {type: [string, 'null'], maxLength: 80}
        revision: {type: integer, minimum: 0}
    ResidentCase:
      type: object
      required: [id, number, houseId, address, kind, status, description, nextStep, revision, fullAccess, canManage, isAuthor, events, documents]
      properties:
        id: {type: string}
        number: {type: integer}
        houseId: {type: string}
        address: {type: string}
        author: {type: [string, 'null']}
        kind: {type: string, enum: [GENERAL, PROBLEM, PAYMENT, WARRANTY]}
        status: {type: string, enum: [RECEIVED, IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED, CLOSED, REOPENED]}
        description: {type: string}
        location: {type: [string, 'null']}
        responsibleUserId: {type: [string, 'null']}
        responsibleName: {type: string}
        openWorkCount: {type: integer, minimum: 0, description: Число незавершённых заданий}
        overdueWorkCount: {type: integer, minimum: 0, description: Задания с прошедшим сроком независимо от общего срока дела}
        nextStep: {type: string}
        dueAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        fullAccess: {type: boolean}
        canManage: {type: boolean}
        isAuthor: {type: boolean}
        events:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              actor: {type: string}
              type: {type: string, enum: [REGISTERED, ASSIGNED, UPDATED, MESSAGE, DOCUMENT, REOPENED, CONFIRMED]}
              text: {type: string}
              createdAt: {type: string, format: date-time}
        documents:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              title: {type: string}
              versions:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    version: {type: integer}
                    mime: {type: string, enum: [application/pdf, image/jpeg, image/png]}
                    size: {type: integer}
                    uploadedBy: {type: string}
                    createdAt: {type: string, format: date-time}
    CaseContext:
      type: object
      properties:
        actorId: {type: string}
        intakeAvailable: {type: boolean}
        canManagePermissions: {type: boolean}
        canReview: {type: boolean}
        staff:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              billingAccess: {type: boolean}
              billingAssignable: {type: boolean}
