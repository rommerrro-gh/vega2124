  /v1/cases:
    get:
      operationId: myResidentCases
      summary: Личные обращения текущего жителя, включая историю и разрешённые документы
      responses:
        '200': {description: Доступные собственные обращения, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ResidentCase'}}}}}
        '401': {description: Требуется вход MAX или тестовый профиль demo}
    post:
      operationId: createResidentCase
      summary: Принять свободное описание без обязательной категории, места или получателя
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateResidentCase'}}}}
      responses:
        '201': {description: Зарегистрировано либо возвращён прежний результат того же clientRequestId, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Неверные данные; WARRANTY при создании жителем запрещён}
        '403': {description: Нет активного подтверждённого доступа жителя}
        '409': {description: Ключ повторён с другим содержимым или приём в доме не подключён}
  /v1/cases/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: residentCase
      summary: Карточка с проверкой текущих прав; соседство и системная роль не дают доступа
      responses:
        '200': {description: Карточка, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '404': {description: Обращение отсутствует или недоступно}
    patch:
      operationId: reviewResidentCase
      summary: Назначение направления, ответственного и следующего шага уполномоченным сотрудником
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateResidentCase'}}}}
      responses:
        '200': {description: Изменения сохранены, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Недопустимое состояние или назначение; финансовое дело нельзя сделать общим}
        '403': {description: Нет требуемого финансового доступа}
        '404': {description: Нет права рассмотрения}
        '409': {description: Устаревшая revision}
  /v1/houses/{houseId}/case-context:
    parameters:
      - {name: houseId, in: path, required: true, schema: {type: string}}
    get:
      operationId: residentCaseContext
      summary: Готовность первичного приёма и сотрудники в разрешённой области
      responses:
        '200': {description: Контекст, content: {application/json: {schema: {$ref: '#/components/schemas/CaseContext'}}}}
        '404': {description: Дом недоступен}
  /v1/houses/{houseId}/case-queue:
    parameters:
      - {name: houseId, in: path, required: true, schema: {type: string}}
    get:
      operationId: residentCaseQueue
      summary: Очередь сотрудников; личные начисления скрыты без отдельного доступа
      responses:
        '200': {description: Карточки; при fullAccess=false описание обезличено, события и документы отсутствуют, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ResidentCase'}}}}}
        '403': {description: Нет доступа к очереди}
  /v1/houses/{houseId}/case-billing-permissions/{userId}:
    parameters:
      - {name: houseId, in: path, required: true, schema: {type: string}}
      - {name: userId, in: path, required: true, schema: {type: string}}
    put:
      operationId: setCaseBillingPermission
      summary: Администратор УК выдаёт или отзывает отдельное полномочие в своей области домов
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
      responses:
        '204': {description: Право изменено и записано в аудит}
        '400': {description: Получатель не имеет действующей принадлежности к дому}
        '403': {description: Нет административного полномочия в этом доме}
  /v1/cases/{id}/collaborators/{userId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: userId, in: path, required: true, schema: {type: string}}
    put:
      operationId: setCaseCollaborator
      summary: Администратор УК назначает участника конкретного дела; функция подрядчика не даёт права приёмки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [function, enabled, revision]
              properties:
                function: {type: string, enum: [COORDINATOR, ENGINEER, WARRANTY, CONTRACTOR, BILLING]}
                enabled: {type: boolean}
                revision: {type: integer, minimum: 0}
      responses:
        '200': {description: Назначение сохранено, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Неверная область доступа получателя}
        '403': {description: Нет административного полномочия}
        '409': {description: Устаревшая revision}
  /v1/cases/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: addResidentCaseMessage
      summary: Ответ жителя или сотрудника с защитой от повторной доставки
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text, clientRequestId], properties: {text: {type: string, minLength: 1, maxLength: 4000}, clientRequestId: {type: string, minLength: 1, maxLength: 80}}}}}}
      responses:
        '200': {description: Ответ сохранён, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Для закрытого дела нужно повторное рассмотрение}
        '404': {description: Нет доступа}
        '409': {description: Иное содержание с прежним ключом}
  /v1/cases/{id}/response:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: respondToResidentCase
      summary: Автор подтверждает предложенный результат или запрашивает повторную проверку
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [confirmed, revision], properties: {confirmed: {type: boolean}, comment: {type: string, maxLength: 2000}, revision: {type: integer, minimum: 0}}}}}}
      responses:
        '200': {description: Ответ сохранён; автоматического закрытия по молчанию нет, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Действие не соответствует состоянию}
        '403': {description: Ответ может дать только автор}
        '404': {description: Нет доступа}
        '409': {description: Устаревшая revision}
  /v1/cases/{id}/documents:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: uploadResidentCaseDocument
      summary: Частный PDF или фотография; новая версия не заменяет прежние байты
      parameters:
        - {name: title, in: query, schema: {type: string, minLength: 1, maxLength: 160, default: Документ}}
        - {name: documentId, in: query, schema: {type: string, maxLength: 80}}
        - {name: expectedVersion, in: query, schema: {type: integer, minimum: 0, default: 0}}
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary, description: 'PDF/JPEG/PNG до 10 МБ; проверяется сигнатура'}}}}}}
      responses:
        '200': {description: Документ сохранён; повторные байты не создают копию, content: {application/json: {schema: {$ref: '#/components/schemas/ResidentCase'}}}}
        '400': {description: Неверный файл или превышен лимит документов / версий}
        '404': {description: Нет доступа к делу или документу}
        '409': {description: expectedVersion не соответствует актуальной версии}
  /v1/case-document-versions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: downloadResidentCaseDocument
      summary: Скачать конкретную версию с повторной проверкой прав и запретом кеширования
      responses:
        '200':
          description: Файл с Content-Disposition attachment и X-Content-Type-Options nosniff
          content:
            application/pdf: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {description: Файл отсутствует или недоступен}
  /v1/guided-demo:
    get:
      operationId: guidedDemoStatus
      summary: Статус личной демонстрации пользователя MAX
      responses:
        '200': {description: Статус демонстрации, content: {application/json: {schema: {$ref: '#/components/schemas/GuidedDemoView'}}}}
        '401': {description: Требуется подписанный вход MAX}
  /v1/guided-demo/activate:
    post:
      operationId: activateGuidedDemo
      summary: Создать изолированный тестовый дом по коду демонстрации
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, minLength: 1, maxLength: 128}}}}}}
      responses:
        '200': {description: Демонстрация активна, content: {application/json: {schema: {$ref: '#/components/schemas/GuidedDemoView'}}}}
        '400': {description: Неверный код или демонстрация недоступна}
        '401': {description: Требуется подписанный вход MAX}
  /v1/guided-demo/restart:
    post:
      operationId: restartGuidedDemo
      summary: Создать новый тестовый дом, закрыв доступ к предыдущему
      responses:
        '200': {description: Новая демонстрация активна, content: {application/json: {schema: {$ref: '#/components/schemas/GuidedDemoView'}}}}
        '400': {description: Демонстрация не активна}
  /v1/guided-demo/exit:
    post:
      operationId: exitGuidedDemo
      summary: Закрыть доступ к личному тестовому дому
      responses:
        '200': {description: Демонстрация завершена, content: {application/json: {schema: {$ref: '#/components/schemas/GuidedDemoView'}}}}
  /:
    get:
      operationId: openMiniApp
      summary: Перейти с корня сайта в мини-приложение
      responses:
        '302': {description: Переход в мини-приложение, headers: {Location: {schema: {type: string}, description: /miniapp/index.html}}}
  /v1/access/config:
    get:
      operationId: accessConfig
      summary: Конфигурация приглашений и демонстрационного режима
      responses:
        '200': {description: Конфигурация ссылки и демонстрационного режима, content: {application/json: {schema: {type: object, properties: {botUsername: {type: string}, demoMode: {type: boolean}}}}}}
  /v1/access/me:
    get:
      operationId: myAccess
      summary: Активные роли текущего пользователя
      responses:
        '200': {description: Список ролей, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessView'}}}}}
  /v1/access/organizations:
    get:
      operationId: accessOrganizations
      summary: УК и их дома для системного администратора
      responses:
        '200': {description: Список УК, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessOrganization'}}}}}
        '403': {description: Нет роли системного администратора}
    post:
      operationId: createAccessOrganization
      summary: Создать УК
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 200}}}}}}
      responses:
        '201': {description: УК создана, content: {application/json: {schema: {$ref: '#/components/schemas/AccessOrganization'}}}}
        '403': {description: Нет роли системного администратора}
  /v1/access/my-organizations:
    get:
      operationId: myAccessOrganizations
      summary: УК и дома в области текущего администратора
      responses:
        '200': {description: Список УК, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessOrganization'}}}}}
  /v1/access/houses:
    get:
      operationId: allAccessHouses
      summary: Все дома для системного администратора
      responses:
        '200': {description: Список домов, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessHouse'}}}}}
        '403': {description: Нет роли системного администратора}
    post:
      operationId: createAccessHouse
      summary: Создать дом
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [address], properties: {address: {type: string, maxLength: 300}}}}}}
      responses:
        '201': {description: Дом создан, content: {application/json: {schema: {$ref: '#/components/schemas/AccessHouse'}}}}
        '403': {description: Нет роли системного администратора}
  /v1/access/organizations/{organizationId}/houses/{houseId}:
    put:
      operationId: setAccessOrganizationHouse
      summary: Закрепить или приостановить дом в УК
      parameters:
        - {name: organizationId, in: path, required: true, schema: {type: string}}
        - {name: houseId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}}
      responses:
        '200': {description: Область УК обновлена, content: {application/json: {schema: {$ref: '#/components/schemas/AccessOrganization'}}}}
        '403': {description: Нет роли системного администратора}
  /v1/access/invitations:
    get:
      operationId: createdAccessInvitations
      summary: Приглашения, созданные текущим пользователем
      responses:
        '200': {description: Список приглашений, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessInvitation'}}}}}
    post:
