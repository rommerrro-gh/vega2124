components:
  schemas:
    PublicSharedProblem:
      type: object
      properties:
        id: {type: string}
        houseId: {type: string}
        title: {type: string}
        category: {$ref: '#/components/schemas/ProblemCategory'}
        location: {type: string, nullable: true}
        status: {type: string, enum: [RECEIVED, IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED, CLOSED, REOPENED]}
        nextStep: {type: string}
        dueAt: {type: string, nullable: true}
        responsibleName: {type: string}
        participants: {type: integer}
        confirmedCount: {type: integer}
        confirmationParticipants: {type: integer}
        myCaseId: {type: string, nullable: true}
        history:
          type: array
          items:
            type: object
            properties:
              action: {type: string}
              note: {type: string}
              createdAt: {type: string}

    OperationsSlot: {"type": "object", "properties": {"startsAt": {"type": ["string", "null"], "format": "date-time"}, "endsAt": {"type": ["string", "null"], "format": "date-time"}}, "required": ["startsAt", "endsAt"]}
    OperationsVisit: {"type": "object", "properties": {"purpose": {"type": "string", "maxLength": 1000, "minLength": 1}, "workerId": {"type": "string", "maxLength": 80, "minLength": 1}, "slots": {"type": "array", "minItems": 1, "maxItems": 5, "items": {"$ref": "#/components/schemas/OperationsSlot"}}, "caseRevision": {"type": "integer", "minimum": 0}, "reason": {"type": "string", "maxLength": 1000, "minLength": 1}}, "required": ["purpose", "workerId", "slots", "caseRevision", "reason"]}
    OperationsVisitChoice: {"type": "object", "properties": {"slotId": {"type": "string", "maxLength": 80, "minLength": 1}, "revision": {"type": "integer", "minimum": 0}, "caseRevision": {"type": "integer", "minimum": 0}}, "required": ["slotId", "revision", "caseRevision"]}
    OperationsVisitDecision: {"type": "object", "properties": {"revision": {"type": "integer", "minimum": 0}, "caseRevision": {"type": "integer", "minimum": 0}, "note": {"type": "string", "maxLength": 2000, "minLength": 1}}, "required": ["revision", "caseRevision", "note"]}
    OperationsMass: {"type": "object", "properties": {"title": {"type": "string", "maxLength": 200, "minLength": 1}, "scope": {"type": "string", "maxLength": 500, "minLength": 1}, "summary": {"type": "string", "maxLength": 3000, "minLength": 1}, "nextStep": {"type": "string", "maxLength": 600, "minLength": 1}, "state": {"type": "string", "enum": ["DRAFT", "ACTIVE", "RESOLVED", "CANCELLED"]}, "dueAt": {"type": ["string", "null"], "format": "date-time"}, "dueBasis": {"type": "string", "maxLength": 1000, "minLength": 1}, "revision": {"type": "integer", "minimum": 0}, "reason": {"type": "string", "maxLength": 1000, "minLength": 1}}, "required": ["title", "scope", "summary", "nextStep", "state", "dueBasis", "revision", "reason"]}
    OperationsLink: {"type": "object", "properties": {"problemId": {"type": "string", "maxLength": 80, "minLength": 1}, "caseRevision": {"type": "integer", "minimum": 0}, "reason": {"type": "string", "maxLength": 1000, "minLength": 1}}, "required": ["problemId", "caseRevision", "reason"]}
    OperationsUnlink: {"type": "object", "properties": {"caseRevision": {"type": "integer", "minimum": 0}, "reason": {"type": "string", "maxLength": 1000, "minLength": 1}}, "required": ["caseRevision", "reason"]}
    OperationsJoin: {"type": "object", "properties": {"clientRequestId": {"type": "string", "maxLength": 80, "minLength": 1}, "description": {"type": "string", "maxLength": 2000}, "location": {"type": "string", "maxLength": 160}}, "required": ["clientRequestId"]}
