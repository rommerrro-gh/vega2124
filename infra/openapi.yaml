components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, details, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object}
        correlationId: {type: string}
    MaxUpdate:
      type: object
      required: [update_type]
      properties:
        update_type: {type: string, minLength: 1}
      additionalProperties: true
    AcceptInvitationRequest:
      type: object
      required: [maxUserId]
      properties:
        maxUserId: {type: string, minLength: 1}
    SetActiveHouseRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}
    CreateReportRequest:
      type: object
      required: [houseId, text]
      properties:
        houseId: {type: string, minLength: 1}
        text: {type: string, minLength: 1, maxLength: 4000}
    WithdrawReportRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CreateIssueRequest:
      type: object
      required: [houseId, category, description, priority]
      properties:
        houseId: {type: string, minLength: 1}
        category: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, EMERGENCY]}
    JoinIssueRequest:
      type: object
      required: [reportId]
      properties:
        reportId: {type: string, minLength: 1}
    MergeIssueRequest:
      type: object
      required: [targetIssueId]
      properties:
        targetIssueId: {type: string, minLength: 1}
    SplitIssueRequest:
      type: object
      required: [reportId, reason]
      properties:
        reportId: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
    ChangeStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [DRAFT, OPEN, ASSIGNED, IN_PROGRESS, RESOLVED, VERIFICATION_72H, CLOSED_CONFIRMED, CLOSED_UNCONFIRMED, REVIEW_REQUIRED, REOPENED, WITHDRAWN, REJECTED]
        reason: {type: string, minLength: 1}
    VerifyIssueRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
        comment: {type: string, maxLength: 2000}
    AddCommentRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    CreateIncidentRequest:
      type: object
      required: [houseId, type, description]
      properties:
        houseId: {type: string, minLength: 1}
        type: {type: string, minLength: 1}
        description: {type: string, minLength: 1, maxLength: 4000}
    CreatePollRequest:
      type: object
      required: [question, options]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {type: string, minLength: 1}
        closesAt: {type: string, format: date-time}
    SyncRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}
