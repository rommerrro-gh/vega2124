      required: [id, expiresAt, activationLimit, activationCount, createdAt]
      properties:
        id: {type: string}
        expiresAt: {type: string, format: date-time}
        activationLimit: {type: integer}
        activationCount: {type: integer}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    CreateHouseInvitationRequest:
      type: object
      required: [days, activationLimit]
      properties:
        days: {type: integer, minimum: 1, maximum: 30}
        activationLimit: {type: integer, minimum: 1, maximum: 100}
    CreatedHouseInvitation:
      type: object
      required: [token, invitation]
      properties:
        token: {type: string}
        invitation: {$ref: '#/components/schemas/HouseInvitation'}
    HousePassportField:
      type: object
      required: [key, value, source, fetchedAt]
      properties:
        key: {type: string}
        value: {}
        source: {type: string}
        sourceUrl: {type: [string, 'null'], format: uri}
        fetchedAt: {type: string, format: date-time}
        validAt: {type: [string, 'null'], format: date-time}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
    ErrorResponse:
      type: object
      required: [code, message, details, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object}
        correlationId: {type: string}
    MaxUpdate:
      type: object
      required: [update_type]
      properties:
        update_type: {type: string, minLength: 1}
      additionalProperties: true
    SetActiveHouseRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}
    LocationFeatures:
      type: object
      required: [area]
      description: Category-specific place. Entrance/floor required for local indoor problems; liftType required for elevators; coverage required for entrance cleaning. Apartment numbers are not collected.
      properties:
        area: {type: string, enum: [ENTRANCE, APARTMENT, BASEMENT, YARD, WHOLE_HOUSE, OTHER]}
        entrance: {type: [integer, 'null'], minimum: 1, maximum: 100}
        floor: {type: [integer, 'null'], minimum: 1, maximum: 200}
        liftType: {type: [string, 'null'], enum: [PASSENGER, CARGO, UNKNOWN, null]}
        liftNumber: {type: [integer, 'null'], minimum: 1, maximum: 100}
        coverage: {type: [string, 'null'], enum: [LOCAL, ENTIRE, null]}
        object: {type: [string, 'null'], enum: [SWING, SLIDE, SANDBOX, OTHER, WHOLE_PLAYGROUND, null]}
        site: {type: [integer, 'null'], minimum: 1, maximum: 100}
        details: {type: [string, 'null'], maxLength: 160}
    CreatePollRequest:
      type: object
      required: [question, options, closesAt]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 200}
        closesAt: {type: string, format: date-time}
        resultsHiddenUntilClose: {type: boolean, default: false}
    SyncRequest:
      type: object
      required: [houseId]
      properties:
        houseId: {type: string, minLength: 1}

    CreateResidentCase:
      type: object
      required: [houseId, kind, description, clientRequestId]
      properties:
        houseId: {type: string, minLength: 1}
        kind: {type: string, enum: [PROBLEM, PAYMENT]}
        description: {type: string, minLength: 1, maxLength: 4000}
        location: {type: [string, 'null'], maxLength: 160}
        category: {type: [string, 'null'], enum: [LIGHTING, WATER, HEATING, ELEVATOR, ENTRANCE_CLEANING, YARD_CLEANING, WASTE_REMOVAL, PLAYGROUND, OTHER, null]}
        locationFeatures: {$ref: '#/components/schemas/LocationFeatures'}
        clientRequestId: {type: string, minLength: 1, maxLength: 80}
      allOf:
        - if:
            properties: {kind: {const: PROBLEM}}
          then:
            required: [category]
            properties: {category: {$ref: '#/components/schemas/ProblemCategory'}}
    ProblemCategory:
      type: string
      enum: [LIGHTING, WATER, HEATING, ELEVATOR, ENTRANCE_CLEANING, YARD_CLEANING, WASTE_REMOVAL, PLAYGROUND, OTHER]
    SharedRequestMerge:
      type: object
      required: [targetId, revision, targetRevision, reason]
      properties:
        targetId: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        targetRevision: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    SharedRequestSplit:
      type: object
      required: [caseId, revision, reason, allocation]
      properties:
        caseId: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        allocation: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/SharedWorkAllocation'}}
    SharedWorkAllocation:
      type: object
      required: [kind, id, revision, move]
      properties:
        kind: {type: string, enum: [WORK_ORDER, INSPECTION, HANDOFF, EXCHANGE]}
        id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        move: {type: boolean, description: Перенести в выделяемую заявку; false — оставить в исходной}
    SharedWorkItem:
      type: object
      properties:
        kind: {type: string, enum: [WORK_ORDER, INSPECTION, HANDOFF, EXCHANGE]}
        id: {type: string}
        title: {type: string}
        revision: {type: integer, minimum: 0}
    SharedRequest:
      type: object
      required: [id, title, category, status, nextStep, participants, confirmedCount, revision, canManage, members, history, work]
      properties:
        id: {type: string}
        title: {type: string}
        category: {$ref: '#/components/schemas/ProblemCategory'}
        location: {type: [string, 'null']}
        status: {type: string, enum: [RECEIVED, IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED, CLOSED, REOPENED]}
        nextStep: {type: string}
        dueAt: {type: [string, 'null']}
        responsibleName: {type: string}
        participants: {type: integer, minimum: 0}
        workflowCaseId: {type: string, description: Служебная карточка общей работы; чтение требует полномочий сотрудника}
        work: {type: array, description: Общие работы доступны только сотрудникам, items: {$ref: '#/components/schemas/SharedWorkItem'}}
        confirmationParticipants: {type: integer, minimum: 0, description: Число действующих участников, от которых требуется подтверждение}
        houseId: {type: string}
        confirmedCount: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 0}
        myCaseId: {type: [string, 'null']}
        canManage: {type: boolean}
        members:
          type: array
          description: Только уполномоченные сотрудники; соседям не выдаются имена, личные сообщения или документы
          items:
            type: object
            properties:
              caseId: {type: string}
              number: {type: integer}
              name: {type: string}
              status: {type: string}
              withdrawn: {type: boolean}
              confirmed: {type: boolean}
        history:
          type: array
          items:
            type: object
            properties:
              action: {type: string, enum: [CREATED, JOINED, UPDATED, CONFIRMED, REOPENED, WITHDRAWN, MERGED, SPLIT, CLASSIFIED]}
              note: {type: string}
              createdAt: {type: string}
    ProblemSearch:
      type: object
      required: [houseId, description, category]
      properties:
        houseId: {type: string, minLength: 1}
        description: {type: string, minLength: 1, maxLength: 4000}
        category: {type: string, enum: [LIGHTING, WATER, HEATING, ELEVATOR, ENTRANCE_CLEANING, YARD_CLEANING, WASTE_REMOVAL, PLAYGROUND, OTHER]}
        location: {type: [string, 'null'], maxLength: 160}
        locationFeatures: {$ref: '#/components/schemas/LocationFeatures'}
    ProblemMatch:
      type: object
      required: [source, id, description, score, reasons]
      properties:
        source: {type: string, enum: [SHARED, OWN_SHARED]}
        id: {type: string}
        description: {type: string}
        location: {type: [string, 'null']}
        score: {type: number, minimum: 0, maximum: 1}
        caseId: {type: [string, 'null'], description: Собственное обращение при OWN_SHARED}
        participants: {type: integer, minimum: 0}
        reasons: {type: array, items: {type: string}}
    UpdateResidentCase:
      type: object
      required: [kind, status, nextStep, revision]
      properties:
        kind: {type: string, enum: [PROBLEM, PAYMENT, WARRANTY]}
        status: {type: string, enum: [IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED]}
        nextStep: {type: string, minLength: 1, maxLength: 600}
        reason: {type: string, maxLength: 1000, description: Обязательна при переносе известного срока или смене назначенного ответственного}
        dueAt: {type: [string, 'null'], format: date-time}
        responsibleUserId: {type: [string, 'null'], maxLength: 80}
        revision: {type: integer, minimum: 0}
    ResidentCase:
      type: object
      required: [id, number, houseId, address, kind, status, description, nextStep, revision, fullAccess, canManage, isAuthor, events, documents]
      properties:
        id: {type: string}
        number: {type: integer}
        houseId: {type: string}
        address: {type: string}
        sharedRequestId: {type: [string, 'null']}
        participants: {type: integer, minimum: 0}
        withdrawn: {type: boolean}
        workflowCaseId: {type: string, description: Основное обращение, на котором ведутся общие работы}
        visitOffered: {type: boolean}
        author: {type: [string, 'null']}
        category: {type: [string, 'null'], enum: [LIGHTING, WATER, HEATING, ELEVATOR, ENTRANCE_CLEANING, YARD_CLEANING, WASTE_REMOVAL, PLAYGROUND, OTHER, null]}
        kind: {type: string, enum: [PROBLEM, PAYMENT, WARRANTY]}
        status: {type: string, enum: [RECEIVED, IN_REVIEW, WAITING_RESIDENT, IN_PROGRESS, RESULT_PROPOSED, CLOSED, REOPENED]}
        description: {type: string}
        location: {type: [string, 'null']}
        responsibleUserId: {type: [string, 'null']}
        responsibleName: {type: string}
        openWorkCount: {type: integer, minimum: 0, description: Число незавершённых заданий}
        overdueWorkCount: {type: integer, minimum: 0, description: Задания с прошедшим сроком независимо от общего срока дела}
        nextStep: {type: string}
        dueAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        fullAccess: {type: boolean}
        canManage: {type: boolean}
        isAuthor: {type: boolean}
        events:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              actor: {type: string}
              type: {type: string, enum: [REGISTERED, ASSIGNED, UPDATED, MESSAGE, DOCUMENT, REOPENED, CONFIRMED]}
              text: {type: string}
              createdAt: {type: string, format: date-time}
        documents:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              title: {type: string}
              versions:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    version: {type: integer}
                    mime: {type: string, enum: [application/pdf, image/jpeg, image/png]}
                    size: {type: integer}
                    uploadedBy: {type: string}
                    createdAt: {type: string, format: date-time}
    CaseContext:
      type: object
      properties:
        actorId: {type: string}
        intakeAvailable: {type: boolean}
        canManagePermissions: {type: boolean}
        canReview: {type: boolean}
        staff:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              billingAccess: {type: boolean}
              billingAssignable: {type: boolean}
