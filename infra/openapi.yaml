openapi: 3.1.0
info:
  title: Пульс дома API
  version: 0.1.0
  description: Контракт из §10 ТЗ. Все маршруты присутствуют; незавершённые операции возвращают 501.
servers:
  - url: https://www.pulsedoma.ru
    description: MAX-стенд с проверкой подписанного WebApp.initData
  - url: https://pulsedoma.ru
    description: Браузерный демостенд с тестовыми ролями
  - url: http://localhost:8080
    description: Локальный запуск
paths:
  /v1/organization-workspaces/{org}/members/{user}/functions:
    put:
      summary: Изменить функции своего специалиста после переназначения незавершённой работы
      parameters:
        - {name: org, in: path, required: true, schema: {type: string}}
        - {name: user, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [functions]
              properties:
                functions: {type: array, minItems: 1, maxItems: 3, items: {type: string, enum: [ENGINEER, WARRANTY, CONTRACTOR]}}
      responses:
        '200': {description: Функции изменены}
        '400': {description: Нужно переназначить незавершённую работу}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
  /v1/organization-workspaces/invitations/preview:
    get:
      summary: Проверить организацию и роль до принятия приглашения
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, maxLength: 200}}
      responses:
        '200': {description: Организация, функция, подразделение и срок приглашения}
        '400': {description: Приглашение недействительно}
        '401': {description: Требуется вход}
  /v1/organization-workspaces:
    get:
      summary: Мои кабинеты организаций
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/organizations:
    get:
      summary: Организации платформы
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
    post:
      summary: Подключить организацию
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name", "kind"], "properties": {"name": {"type": "string", "maxLength": 160}, "kind": {"type": "string", "enum": ["MANAGEMENT_COMPANY", "DEVELOPER", "GENERAL_CONTRACTOR", "CONTRACTOR", "WARRANTY_SERVICE"]}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/houses:
    get:
      summary: Область домов организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/houses/{house}:
    put:
      summary: Изменить область домов организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "house", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["active"], "properties": {"active": {"type": "boolean"}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/members:
    get:
      summary: Команда своей организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/members/{user}:
    put:
      summary: Отозвать роль сотрудника
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["role", "active"], "properties": {"role": {"type": "string", "enum": ["ADMIN", "COORDINATOR", "SPECIALIST"]}, "active": {"type": "boolean"}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/coordinator:
    put:
      summary: Назначить себя координатором своей организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["active"], "properties": {"active": {"type": "boolean"}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/invitations:
    get:
      summary: Приглашения сотрудников
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
    post:
      summary: Одноразовое приглашение сотрудника на семь дней
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["role", "department", "functions"], "properties": {"role": {"type": "string", "enum": ["ADMIN", "COORDINATOR", "SPECIALIST"]}, "department": {"type": "string", "maxLength": 160}, "functions": {"type": "array", "maxItems": 3, "items": {"type": "string", "enum": ["ENGINEER", "WARRANTY", "CONTRACTOR"]}}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/invitations/{key}:
    delete:
      summary: Отозвать неиспользованное приглашение
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "key", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/accept:
    post:
      summary: Принять приглашение без автоматического доступа к делам
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["token"], "properties": {"token": {"type": "string", "maxLength": 200}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/coordinators/reassign:
    post:
      summary: Администратор передаёт незавершённые технические дела координатору своей организации
      parameters:
        - {in: path, name: org, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromUserId, toUserId]
              properties:
                fromUserId: {type: string, minLength: 1}
                toUserId: {type: string, minLength: 1}
      responses:
        '200': {description: Количество переданных дел; личные финансовые дела исключены}
        '400': {description: Неподходящий координатор}
        '403': {description: Нужны полномочия администратора организации}
  /v1/organization-workspaces/{org}/partners:
    get:
      summary: Партнёры в подтверждённой области домов
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/cases:
    get:
      summary: Назначенные обращения выбранного кабинета
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "mode", "in": "query", "required": true, "schema": {"type": "string", "enum": ["COORDINATOR", "SPECIALIST"]}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/tasks:
    get:
      summary: Осмотры и работы выбранного кабинета
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "mode", "in": "query", "required": true, "schema": {"type": "string", "enum": ["COORDINATOR", "SPECIALIST"]}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/transfers:
    get:
      summary: История передач организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
    post:
      summary: Направить техническое обращение с сохранением текущего ответственного
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["caseId", "target", "reason", "revision"], "properties": {"caseId": {"type": "string"}, "target": {"type": "string"}, "reason": {"type": "string", "maxLength": 3000}, "revision": {"type": "integer", "minimum": 0}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/transfers/{key}/reply:
    post:
      summary: Принять, вернуть или отклонить передачу
      parameters: [{"name": "key", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["state", "note", "revision"], "properties": {"state": {"type": "string", "enum": ["ACCEPTED", "RETURNED", "REFUSED"]}, "note": {"type": "string", "maxLength": 3000}, "revision": {"type": "integer", "minimum": 0}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/organization-workspaces/{org}/cases/{caseId}/assignments:
    put:
      summary: Назначить или снять сотрудника своей организации
      parameters: [{"name": "org", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "caseId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["userId", "function", "revision", "enabled"], "properties": {"userId": {"type": "string"}, "function": {"type": "string", "enum": ["COORDINATOR", "ENGINEER", "WARRANTY", "CONTRACTOR"]}, "revision": {"type": "integer", "minimum": 0}, "enabled": {"type": "boolean"}}}}}}
      responses:
        '200': {description: Операция выполнена в пределах полномочий кабинета}
        '400': {description: Некорректные данные или состояние}
        '401': {description: Требуется вход}
        '403': {description: Недостаточно полномочий}
        '409': {description: Данные изменились}
  /v1/houses/{house}/shared-problems:
    get:
      summary: Общие проблемы дома без личных материалов участников
      parameters:
        - {name: house, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Публичные сведения общей работы для жителя своего дома
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PublicSharedProblem'}}
        '401': {description: Требуется вход}
        '404': {description: Дом недоступен}
  /v1/shared-problems/{id}:
    get:
      summary: Публичная карточка общей проблемы
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Без участников, частных файлов и служебных назначений
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSharedProblem'}
        '401': {description: Требуется вход}
        '404': {description: Заявка недоступна}

  /v1/me/profile: {"get": {"operationId": "currentProfile", "responses": {"200": {"description": "Данные текущего пользователя", "content": {"application/json": {"schema": {"type": "object", "required": ["id", "displayName", "fromMax"], "properties": {"id": {"type": "string"}, "displayName": {"type": "string"}, "fromMax": {"type": "boolean"}}}}}}, "401": {"description": "Требуется авторизованный вход"}}}}
  /v1/me/preferences: {"get": {"operationId": "currentPreferences", "responses": {"200": {"description": "Данные текущего пользователя", "content": {"application/json": {"schema": {"type": "object", "required": ["caseUpdates"], "properties": {"caseUpdates": {"type": "boolean"}}}}}}, "401": {"description": "Требуется авторизованный вход"}}}, "put": {"operationId": "setCurrentPreferences", "responses": {"200": {"description": "Данные текущего пользователя", "content": {"application/json": {"schema": {"type": "object", "required": ["caseUpdates"], "properties": {"caseUpdates": {"type": "boolean"}}}}}}, "401": {"description": "Требуется авторизованный вход"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["caseUpdates"], "properties": {"caseUpdates": {"type": "boolean"}}}}}}}}
  /miniapp/home: {"get": {"operationId": "page_home", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/cases: {"get": {"operationId": "page_cases", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/events: {"get": {"operationId": "page_events", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/profile: {"get": {"operationId": "page_profile", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/settings: {"get": {"operationId": "page_settings", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/houses: {"get": {"operationId": "page_houses", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/roles: {"get": {"operationId": "page_roles", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/notifications: {"get": {"operationId": "page_notifications", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/help: {"get": {"operationId": "page_help", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/about: {"get": {"operationId": "page_about", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/contacts: {"get": {"operationId": "page_contacts", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/passport: {"get": {"operationId": "page_passport", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/tariffs: {"get": {"operationId": "page_tariffs", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/payment: {"get": {"operationId": "page_payment", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/similar: {"get": {"operationId": "page_similar", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/new: {"get": {"operationId": "page_new", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
  /miniapp/cases/{id}: {"parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}], "get": {"operationId": "page_cases_detail", "responses": {"200": {"description": "Оболочка страницы; данные загружаются через авторизованный API", "content": {"text/html": {"schema": {"type": "string"}}}}}}}
